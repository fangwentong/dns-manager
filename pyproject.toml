[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-manager"
dynamic = ["version"]
description = "Command line tool for declarative multi-vendor DNS management"
readme = "README.md"
authors = [{ name = "fangwentong", email = "fangwentong2012@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "PyNamecheap==0.0.3",
    "aliyun-python-sdk-alidns>=2.0.6,<3.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.31.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff==0.17.6",
]

[project.scripts]
dns-manager = "dns_manager.dns_cli:main"

[tool.setuptools]
packages = ["dns_manager"]
package-dir = { "dns_manager" = "src" }

[tool.setuptools.dynamic]
version = { attr = "dns_manager.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dns_manager"]
